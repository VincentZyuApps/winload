            end

            test do
              system "#{bin}/winload", "--version"
            end
          end
          HEREDOC

          # 移除 heredoc 缩进
          sed -i 's/^          //' Formula/winload.rb

          echo "📝 Generated Formula/winload.rb (Gitee):"
          cat Formula/winload.rb

      - name: Push to Gitee homebrew-tap repo
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"

          retry_gitee_git() {
            local operation="$1"
            shift
            local max_attempts=4
            local delay=5
            local attempt

            for attempt in $(seq 1 "$max_attempts"); do
              echo "🔁 Gitee ${operation}: attempt ${attempt}/${max_attempts}"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "::warning::Gitee ${operation} failed; retrying in ${delay}s."
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done

            echo "::error::Gitee ${operation} failed after ${max_attempts} attempts."
            return 1
          }

          clone_gitee_tap() {
            rm -rf brew-repo
            git clone https://vincent-zyu:${GITEE_TOKEN}@gitee.com/vincent-zyu/homebrew-tap.git brew-repo
          }

          retry_gitee_git "Homebrew tap clone" clone_gitee_tap
          cp Formula/winload.rb brew-repo/Formula/winload.rb

          cd brew-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/winload.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: 🍺 Update winload to ${VERSION}"
            retry_gitee_git "Homebrew tap push" git push
          fi

          echo "✅ Gitee Homebrew tap updated!"

  # ── 更新 AUR 包（winload-rust-bin: 预编译二进制）─────────────
  publish-aur-bin:
    name: Update AUR Package (winload-rust-bin)
    needs: [check, release]
    if: always() && needs.check.outputs.should_publish_aur == 'true' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Linux binaries from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"

          echo "📥 Downloading x86_64 binary..."
          curl -fSL -o winload-linux-x86_64 "${BASE_URL}/winload-linux-x86_64-${VERSION}"
          SHA256_X86=$(sha256sum winload-linux-x86_64 | awk '{print $1}')
          echo "🔑 x86_64 SHA256: $SHA256_X86"
          echo "SHA256_X86=$SHA256_X86" >> "$GITHUB_ENV"

          echo "📥 Downloading aarch64 binary..."
          curl -fSL -o winload-linux-aarch64 "${BASE_URL}/winload-linux-aarch64-${VERSION}"
          SHA256_ARM=$(sha256sum winload-linux-aarch64 | awk '{print $1}')
          echo "🔑 aarch64 SHA256: $SHA256_ARM"
          echo "SHA256_ARM=$SHA256_ARM" >> "$GITHUB_ENV"

      - name: Generate PKGBUILD
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          TAGVER="${VERSION#v}"           # 0.1.6-beta.3 (for download URL)
          PKGVER="${TAGVER//-/.}"         # 0.1.6.beta.3 (AUR compliant)

          cat > PKGBUILD << HEREDOC_END
          # Maintainer: VincentZyu <vincentzyu233@gmail.com>
          pkgname=winload-rust-bin
          pkgver=${PKGVER}
          pkgrel=1
          pkgdesc="A lightweight, real-time CLI tool for monitoring network bandwidth and traffic"
          arch=('x86_64' 'aarch64')
          url="https://github.com/VincentZyuApps/winload"
          license=('MIT')
          provides=('winload')
          conflicts=('winload' 'winload-rust')
          _tagver=${TAGVER}
          _base_url="https://github.com/VincentZyuApps/winload/releases/download/v\${_tagver}"
          source_x86_64=("winload-linux-x86_64-v\${_tagver}::\${_base_url}/winload-linux-x86_64-v\${_tagver}")
          source_aarch64=("winload-linux-aarch64-v\${_tagver}::\${_base_url}/winload-linux-aarch64-v\${_tagver}")
          noextract=()
          sha256sums_x86_64=('${SHA256_X86}')
          sha256sums_aarch64=('${SHA256_ARM}')

          package() {
              if [[ "\$CARCH" == "x86_64" ]]; then
                  install -Dm755 "\$srcdir/winload-linux-x86_64-v\${_tagver}" "\$pkgdir/usr/bin/winload"
              elif [[ "\$CARCH" == "aarch64" ]]; then
                  install -Dm755 "\$srcdir/winload-linux-aarch64-v\${_tagver}" "\$pkgdir/usr/bin/winload"
              fi
          }
          HEREDOC_END

          # Remove leading whitespace (heredoc indentation)
          sed -i 's/^          //' PKGBUILD

          echo "📝 Generated PKGBUILD:"
          cat PKGBUILD

      - name: Generate .SRCINFO
        uses: docker://archlinux@sha256:345a872f6c95e082d4b8c050af637eebb57402c6e2177b411c3acf7df84eb33b
        with:
          args: bash -c "pacman -Sy --noconfirm pacman-contrib base-devel && useradd -m builder && cp PKGBUILD /home/builder/ && cd /home/builder && sudo -u builder makepkg --printsrcinfo > .SRCINFO && cp .SRCINFO /github/workspace/"

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          TAGVER="${VERSION#v}"           # 0.1.6-beta.3 (for download URL)
          PKGVER="${TAGVER//-/.}"         # 0.1.6.beta.3 (AUR compliant)

          # Setup SSH for AUR
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat >> ~/.ssh/config << 'SSHEOF'
          Host aur.archlinux.org
              IdentityFile ~/.ssh/aur
              User aur
              StrictHostKeyChecking no
          SSHEOF

          retry_aur() {
            local operation="$1"
            shift
            local max_attempts=5
            local delay=15
            local attempt

            for attempt in $(seq 1 "$max_attempts"); do
              echo "🔁 AUR ${operation}: attempt ${attempt}/${max_attempts}"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "::error::AUR ${operation} failed after ${max_attempts} attempts."
                return 1
              fi
              echo "::warning::AUR ${operation} failed; retrying in ${delay}s."
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          clone_aur() {
            rm -rf aur-repo
            git clone ssh://aur@aur.archlinux.org/winload-rust-bin.git aur-repo
          }

          # AUR occasionally enters maintenance mode, so retry transient clone failures.
          retry_aur "clone" clone_aur

          # Copy files
          cp PKGBUILD aur-repo/
          cp .SRCINFO aur-repo/

          # Commit and push
          cd aur-repo
          git config user.name "VincentZyu"
          git config user.email "vincentzyu233@gmail.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: 🔼 Update to ${PKGVER}"
            retry_aur "push" git push
          fi

          echo "✅ winload-rust-bin updated!"

  # ── 发布到 npm（scoped: @vincentzyuapps/winload）─────────────────
  # 原理同 esbuild / @biomejs/biome / turbo:
  #   1. 为每个平台发布一个只含二进制的包 (os/cpu 字段让 npm 自动筛选)
  #   2. 主包 @vincentzyuapps/winload 通过 optionalDependencies 引用它们
  #   3. 用户 npm install 时只下载匹配当前平台的那一个
  publish-npm-scope:
    name: Publish to npm (scoped)
    needs: [check, release]
    if: always() && needs.check.outputs.should_publish_npm == 'true' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    permissions:
      id-token: write
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download binaries from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"

          mkdir -p artifacts
          echo "📥 Downloading binaries for npm publish..."

          download_release_asset() {
            curl -fSL --retry 4 --retry-delay 5 --retry-all-errors --retry-connrefused \
              --connect-timeout 30 --max-time 300 -o "$1" "$2"
          }

          download_release_asset artifacts/winload-windows-x86_64.exe  "${BASE_URL}/winload-windows-x86_64-msvc-npcap-${VERSION}.exe"
          download_release_asset artifacts/winload-windows-aarch64.exe "${BASE_URL}/winload-windows-aarch64-msvc-npcap-${VERSION}.exe"
          download_release_asset artifacts/winload-linux-x86_64        "${BASE_URL}/winload-linux-x86_64-${VERSION}"
          download_release_asset artifacts/winload-linux-aarch64       "${BASE_URL}/winload-linux-aarch64-${VERSION}"
          download_release_asset artifacts/winload-macos-x86_64        "${BASE_URL}/winload-macos-x86_64-${VERSION}"
          download_release_asset artifacts/winload-macos-aarch64       "${BASE_URL}/winload-macos-aarch64-${VERSION}"

          echo "✅ Downloaded:"
          ls -lh artifacts/

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          NPM_VERSION="${VERSION#v}"
          NPM_TAG="latest"
          if [[ "$NPM_VERSION" == *-alpha.* ]]; then
            NPM_TAG="alpha"
          fi
          echo "📦 npm version: ${NPM_VERSION} (tag: ${NPM_TAG})"

          publish_with_retry() {
            local package_name="$1"
            local registry="$2"
            shift 2
            local max_attempts=4
            local delay=5
            local attempt

            for attempt in $(seq 1 "$max_attempts"); do
              echo "🔁 Publishing ${package_name}: attempt ${attempt}/${max_attempts}"
              if npm publish "$@"; then
                return 0
              fi

              # A connection may drop after npm accepts the immutable version.
              if npm view "${package_name}@${NPM_VERSION}" version --registry "$registry" > /dev/null 2>&1; then
                echo "${package_name}@${NPM_VERSION} is available after the failed request; treating it as published."
                return 0
              fi

              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "::warning::Publish failed; retrying in ${delay}s."
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done

            echo "::error::Failed to publish ${package_name} after ${max_attempts} attempts."
            return 1
          }

          PLATFORMS=(
            "@vincentzyuapps/winload-win32-x64|win32|x64|artifacts/winload-windows-x86_64.exe|winload.exe"
            "@vincentzyuapps/winload-win32-arm64|win32|arm64|artifacts/winload-windows-aarch64.exe|winload.exe"
            "@vincentzyuapps/winload-linux-x64|linux|x64|artifacts/winload-linux-x86_64|winload"
            "@vincentzyuapps/winload-linux-arm64|linux|arm64|artifacts/winload-linux-aarch64|winload"
            "@vincentzyuapps/winload-darwin-x64|darwin|x64|artifacts/winload-macos-x86_64|winload"
            "@vincentzyuapps/winload-darwin-arm64|darwin|arm64|artifacts/winload-macos-aarch64|winload"
          )

          for entry in "${PLATFORMS[@]}"; do
            IFS='|' read -r PKG_NAME PKG_OS PKG_CPU SOURCE_BIN BIN_NAME <<< "$entry"
            echo ""
            echo "📦 Publishing ${PKG_NAME}@${NPM_VERSION}..."

            PKG_DIR="npm-platforms/${PKG_NAME}"
            mkdir -p "${PKG_DIR}/bin"

            cp "${SOURCE_BIN}" "${PKG_DIR}/bin/${BIN_NAME}"
            chmod +x "${PKG_DIR}/bin/${BIN_NAME}"

            cat > "${PKG_DIR}/package.json" << PKGJSON
          {
            "name": "${PKG_NAME}",
            "version": "${NPM_VERSION}",
            "description": "winload binary for ${PKG_OS}-${PKG_CPU}",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/${{ github.repository }}"
            },
            "os": ["${PKG_OS}"],
            "cpu": ["${PKG_CPU}"],
            "files": ["bin/"]
          }
          PKGJSON

            cd "${PKG_DIR}"
            if npm view "${PKG_NAME}@${NPM_VERSION}" version --registry https://registry.npmjs.org > /dev/null 2>&1; then
              echo "${PKG_NAME}@${NPM_VERSION} already exists; skipping"
            else
              publish_with_retry "$PKG_NAME" "https://registry.npmjs.org" --provenance --access public --tag "${NPM_TAG}"
            fi
            cd "$GITHUB_WORKSPACE"
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          NPM_VERSION="${VERSION#v}"
          NPM_TAG="latest"
          if [[ "$NPM_VERSION" == *-alpha.* ]]; then
            NPM_TAG="alpha"
          fi

          cp readme.md npm/winload-rust-bin/readme.md

          cd npm/winload-rust-bin

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${NPM_VERSION}';
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '${NPM_VERSION}';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "📦 Publishing @vincentzyuapps/winload@${NPM_VERSION} (tag: ${NPM_TAG})..."
          cat package.json
          publish_with_retry() {
            local package_name="$1"
            local max_attempts=4
            local delay=5
            local attempt

            for attempt in $(seq 1 "$max_attempts"); do
              echo "🔁 Publishing ${package_name}: attempt ${attempt}/${max_attempts}"
              if npm publish --provenance --access public --tag "${NPM_TAG}"; then
                return 0
              fi
              if npm view "${package_name}@${NPM_VERSION}" version --registry https://registry.npmjs.org > /dev/null 2>&1; then
                echo "${package_name}@${NPM_VERSION} is available after the failed request; treating it as published."
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "::warning::Publish failed; retrying in ${delay}s."
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done

            echo "::error::Failed to publish ${package_name} after ${max_attempts} attempts."
            return 1
          }
          publish_with_retry "@vincentzyuapps/winload"

          echo "✅ Scoped package published!"

      - name: Upload npm packages for downstream jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-packages
          path: |
            npm-platforms/
            npm/winload-rust-bin/
          if-no-files-found: error

  # ── 发布到 npm（unscoped: winload-rust-bin）─────────────────
  publish-npm-unscope:
    name: Publish to npm (unscoped)
    needs: [check, release, publish-npm-scope]
    if: always() && needs.check.outputs.should_publish_npm == 'true' && needs.publish-npm-scope.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-packages

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish winload-rust-bin (unscoped) to npm
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          NPM_VERSION="${VERSION#v}"
          NPM_TAG="latest"
          if [[ "$NPM_VERSION" == *-alpha.* ]]; then
            NPM_TAG="alpha"
          fi

          cd npm/winload-rust-bin
          node -e "
            const p = require('./package.json');
            p.name = 'winload-rust-bin';
            require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');
          "
          echo "📦 Publishing winload-rust-bin@${NPM_VERSION} (tag: ${NPM_TAG})..."
          publish_with_retry() {
            local package_name="winload-rust-bin"
            local max_attempts=4
            local delay=5
            local attempt

            for attempt in $(seq 1 "$max_attempts"); do
              echo "🔁 Publishing ${package_name}: attempt ${attempt}/${max_attempts}"
              if npm publish --provenance --access public --tag "${NPM_TAG}"; then
                return 0
              fi
              if npm view "${package_name}@${NPM_VERSION}" version --registry https://registry.npmjs.org > /dev/null 2>&1; then
                echo "${package_name}@${NPM_VERSION} is available after the failed request; treating it as published."
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "::warning::Publish failed; retrying in ${delay}s."
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done

            echo "::error::Failed to publish ${package_name} after ${max_attempts} attempts."
            return 1
          }
          publish_with_retry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 同步发布到 GitHub Packages (npm.pkg.github.com) ────────
  publish-npm-github-packages:
    name: Publish to GitHub Packages for npm
    needs: [check, release, publish-npm-scope]
    if: always() && needs.check.outputs.should_publish_npm == 'true' && needs.publish-npm-scope.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-packages

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Publish platform packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          NPM_VERSION="${VERSION#v}"
          NPM_TAG="latest"
          if [[ "$NPM_VERSION" == *-alpha.* ]]; then
            NPM_TAG="alpha"
          fi

          publish_with_retry() {
            local package_name="$1"
            local max_attempts=4
            local delay=5
            local attempt

            for attempt in $(seq 1 "$max_attempts"); do
              echo "🔁 Publishing ${package_name}: attempt ${attempt}/${max_attempts}"
              if npm publish --registry https://npm.pkg.github.com --tag "${NPM_TAG}"; then
                return 0
              fi
              if npm view "${package_name}@${NPM_VERSION}" version --registry https://npm.pkg.github.com > /dev/null 2>&1; then
                echo "${package_name}@${NPM_VERSION} is available after the failed request; treating it as published."
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "::warning::Publish failed; retrying in ${delay}s."
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done

            echo "::error::Failed to publish ${package_name} after ${max_attempts} attempts."
            return 1
          }

          for dir in npm-platforms/@vincentzyuapps/*/; do
            [ -d "$dir" ] || continue
            echo "📦 Publishing $(basename $dir) to GitHub Packages..."
            cd "$dir"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
            PKG_NAME=$(node -p "require('./package.json').name")
            if npm view "${PKG_NAME}@${NPM_VERSION}" version --registry https://npm.pkg.github.com > /dev/null 2>&1; then
              echo "${PKG_NAME}@${NPM_VERSION} already exists; skipping"
            else
              publish_with_retry "$PKG_NAME"
            fi
            cd "$GITHUB_WORKSPACE"
          done

      - name: Publish main package to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          NPM_VERSION="${VERSION#v}"
          NPM_TAG="latest"
          if [[ "$NPM_VERSION" == *-alpha.* ]]; then
            NPM_TAG="alpha"
          fi

          cd npm/winload-rust-bin
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          echo "📦 Publishing @vincentzyuapps/winload@${NPM_VERSION} to GitHub Packages (tag: ${NPM_TAG})..."
          publish_with_retry() {
            local package_name="@vincentzyuapps/winload"
            local max_attempts=4
            local delay=5
            local attempt

            for attempt in $(seq 1 "$max_attempts"); do
              echo "🔁 Publishing ${package_name}: attempt ${attempt}/${max_attempts}"
              if npm publish --registry https://npm.pkg.github.com --tag "${NPM_TAG}"; then
                return 0
              fi
              if npm view "${package_name}@${NPM_VERSION}" version --registry https://npm.pkg.github.com > /dev/null 2>&1; then
                echo "${package_name}@${NPM_VERSION} is available after the failed request; treating it as published."
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "::warning::Publish failed; retrying in ${delay}s."
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done

            echo "::error::Failed to publish ${package_name} after ${max_attempts} attempts."
            return 1
          }
          publish_with_retry

          echo "✅ GitHub Packages published!"

  # ── 发布到 PyPI (Python 包) ───────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: check
    if: needs.check.outputs.should_publish_pypi == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Copy readme for PyPI
        run: cp readme.md python/readme.md

      - name: Generate Python build info
        run: |
          COMMIT_HASH="$(git rev-parse --short=7 HEAD)"
          COMMIT_TIME="$(git show -s --format=%cI HEAD)"
          sed -i \
            -e "s|^GIT_COMMIT_HASH = .*|GIT_COMMIT_HASH = \"${COMMIT_HASH}\"|" \
            -e "s|^GIT_COMMIT_TIME = .*|GIT_COMMIT_TIME = \"${COMMIT_TIME}\"|" \
            -e "s|^GIT_DIRTY = .*|GIT_DIRTY = False|" \
            python/_build_info.py
          cat python/_build_info.py

      - name: Build package
        working-directory: python
        run: |
          uv build

      - name: Publish to PyPI
        working-directory: python
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv publish --publish-url https://upload.pypi.org/legacy/

  # ── 发布到 crates.io (Rust 包) ───────────────────────────────
  publish-crates-io:
    name: Publish to crates.io
    needs: check
    if: needs.check.outputs.should_publish_crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Prepare README for crates.io
        run: |
          pwd
          ls -la
          cp ./readme.md ./rust/readme.md

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd rust
          cargo publish --locked --allow-dirty --token "$CARGO_REGISTRY_TOKEN"
          echo "✅ Published to crates.io!"

  # ── 同步 Release 到 Gitee ─────────────────────────────────
  # 在 release 完成后运行，与 publish-scoop/aur/npm 并行
  sync-gitee-release:
    name: 【Gitee码云】Sync Release File
    needs: [check, release]
    if: needs.check.outputs.should_release == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: vincent-zyu
      GITEE_REPO: winload
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get release info from GitHub
        id: release_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.check.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          
          # 获取 Release 信息
          RELEASE_INFO=$(gh release view "$TAG" --json name,body,assets)
          echo "release_name=$(echo "$RELEASE_INFO" | jq -r '.name')" >> "$GITHUB_OUTPUT"
          echo "$RELEASE_INFO" | jq -r '.body' > release_body.md
          echo "$RELEASE_INFO" | jq -r '.assets[].url' > asset_urls.txt
          
          echo "📦 Release: $TAG"
          echo "📝 Assets:"
          cat asset_urls.txt

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          mkdir -p assets
          cd assets
          max_attempts=4
          delay=5
          for attempt in $(seq 1 "$max_attempts"); do
            echo "🔁 Downloading release assets: attempt ${attempt}/${max_attempts}"
            if gh release download "$TAG" --pattern "*" --clobber; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Failed to download release assets after ${max_attempts} attempts."
              exit 1
            fi
            echo "::warning::Download failed; retrying in ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
          done
          echo "📥 Downloaded files:"
          ls -la

      - name: Create or find Gitee Release
        id: gitee_release
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          NAME="${{ steps.release_info.outputs.release_name }}"
          IS_PRERELEASE=false
          if [[ "$TAG" == *-alpha.* ]]; then
            IS_PRERELEASE=true
          fi
          echo "🏷️ Gitee prerelease: $IS_PRERELEASE"
          
          # JSON 安全转义 release body（处理换行、引号、反斜杠等）
          JSON_BODY=$(jq -R -s '.' < release_body.md)
          
          CURL=(curl -sS --retry 4 --retry-delay 5 --retry-all-errors --retry-connrefused --connect-timeout 30 --max-time 120)
          CURL_FAIL=(curl -fsS --retry 4 --retry-delay 5 --retry-all-errors --retry-connrefused --connect-timeout 30 --max-time 120)
          
          # 1. 确保 tag 存在于 Gitee
          if "${CURL_FAIL[@]}" "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/tags/${TAG}?access_token=${GITEE_TOKEN}" > /dev/null 2>&1; then
            echo "🏷️ Tag $TAG already exists on Gitee"
          else
            echo "🏷️ Creating tag $TAG on Gitee..."
            "${CURL_FAIL[@]}" -X POST --header 'Content-Type: application/json;charset=UTF-8' \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/tags" \
              -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"refs\":\"main\",\"tag_message\":\"Release ${TAG}\"}"
          fi
          
          # 2. 检查是否已有对应 tag 的 Release
          EXISTING=$("${CURL[@]}" "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}")
          RELEASE_ID=$(echo "$EXISTING" | jq -r '.id')
          
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            ASSET_COUNT=$(echo "$EXISTING" | jq '.assets | length')
            echo "⚠️ Gitee release already exists (ID: $RELEASE_ID, assets: $ASSET_COUNT)"
          else
            echo "✅ No existing release, creating..."
            
            # 3. 创建 Release（注意 target_commitish 是必填字段）
            RELEASE_PAYLOAD=$(jq -n \
              --arg token "$GITEE_TOKEN" \
              --arg tag "$TAG" \
              --arg name "$NAME" \
              --argjson body "$JSON_BODY" \
              --argjson prerelease "$IS_PRERELEASE" \
              '{
                access_token: $token,
                tag_name: $tag,
                name: $name,
                body: $body,
                target_commitish: "main",
                prerelease: $prerelease
              }')
            
            CREATE_RESPONSE=$("${CURL_FAIL[@]}" -X POST --header 'Content-Type: application/json;charset=UTF-8' \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -d "$RELEASE_PAYLOAD")
            
            RELEASE_ID=$(echo "$CREATE_RESPONSE" | jq -r '.id')
            ASSET_COUNT=0
            
            if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
              echo "❌ Failed to create Gitee release"
              echo "Response: $CREATE_RESPONSE"
              exit 1
            fi
            echo "✅ Created Gitee release (ID: $RELEASE_ID)"
          fi
          
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "asset_count=$ASSET_COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload assets to Gitee
        if: steps.gitee_release.outputs.release_id != '' && steps.gitee_release.outputs.release_id != 'null'
        run: |
          RELEASE_ID="${{ steps.gitee_release.outputs.release_id }}"
          
          # 时间戳函数：同时输出 UTC 和 上海时间
          ts() {
            echo "[$(date -u '+%H:%M:%S UTC') / $(TZ='Asia/Shanghai' date '+%H:%M:%S CST')]"
          }
          
          echo "$(ts) 📤 Uploading assets to Gitee release (ID: $RELEASE_ID)"
          
          SUCCESS=0
          FAIL=0
          TOTAL=$(ls -1 assets/ | wc -l)
          CURRENT=0
          echo "$(ts) 📁 Total files to upload: $TOTAL"
          
          for FILE in assets/*; do
            if [ -f "$FILE" ]; then
              CURRENT=$((CURRENT + 1))
              FILENAME=$(basename "$FILE")
              FILESIZE=$(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE" 2>/dev/null)
              FILESIZE_H=$(numfmt --to=iec $FILESIZE 2>/dev/null || echo "${FILESIZE} bytes")
              echo ""
              echo "$(ts) ──── [$CURRENT/$TOTAL] $FILENAME ($FILESIZE_H) ────"
              
              # 重试 3 次，超时 1200s (20min)，间隔 10s
              # Gitee 上传速度约 10KB/s，3MB 文件需要 ~300s
              UPLOADED=false
              for ATTEMPT in 1 2 3; do
                echo "$(ts)   🔄 Attempt $ATTEMPT/3 — starting curl (max-time=1200s, connect-timeout=30s)"
                
                START_TIME=$(date +%s)
                if RESPONSE=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --retry-connrefused \
                  --max-time 1200 --connect-timeout 30 \
                  -w "\n%{http_code}" \
                  -X POST --header "Content-Type: multipart/form-data" \
                  -F "access_token=${GITEE_TOKEN}" \
                  -F "file=@${FILE}" \
                  "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files"); then
                  CURL_EXIT=0
                else
                  CURL_EXIT=$?
                fi
                END_TIME=$(date +%s)
                ELAPSED=$((END_TIME - START_TIME))
                
                # 分离 HTTP status code 和 response body
                HTTP_CODE=$(echo "$RESPONSE" | tail -1)
                BODY=$(echo "$RESPONSE" | sed '$d')
                
                echo "$(ts)   📡 curl exit=$CURL_EXIT, HTTP=$HTTP_CODE, took ${ELAPSED}s"
                
                if [ $CURL_EXIT -ne 0 ]; then
                  case $CURL_EXIT in
                    28) echo "$(ts)   ⏱️ TIMEOUT: curl exceeded max-time (${ELAPSED}s)" ;;
                    7)  echo "$(ts)   🔌 CONNECTION REFUSED: Gitee server unreachable" ;;
                    56) echo "$(ts)   💥 RECV ERROR: connection reset during transfer" ;;
                    *)  echo "$(ts)   ❓ CURL ERROR $CURL_EXIT (see https://curl.se/libcurl/c/libcurl-errors.html)" ;;
                  esac
                elif echo "$BODY" | jq -e '.browser_download_url' > /dev/null 2>&1; then
                  URL=$(echo "$BODY" | jq -r '.browser_download_url')
                  echo "$(ts)   ✅ SUCCESS: $URL"
                  SUCCESS=$((SUCCESS + 1))
                  UPLOADED=true
                  break
                else
                  echo "$(ts)   ⚠️ UNEXPECTED RESPONSE (HTTP $HTTP_CODE):"
                  echo "$(ts)   $(echo "$BODY" | head -c 300)"
                fi
                
                if [ $ATTEMPT -lt 3 ]; then
                  echo "$(ts)   💤 Waiting 10s before retry..."
                  sleep 10
                fi
              done
              
              if [ "$UPLOADED" = false ]; then
                echo "$(ts)   ❌ GAVE UP on $FILENAME after 3 attempts"
                FAIL=$((FAIL + 1))
              fi
            fi
          done
          
          echo ""
          echo "$(ts) ════════════════════════════════════════"
          echo "$(ts) 📊 Upload summary: $SUCCESS/$TOTAL succeeded, $FAIL failed"
          echo "$(ts) ════════════════════════════════════════"
          
          echo "📊 Upload complete: $SUCCESS succeeded, $FAIL failed"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Gitee release asset upload failed for $FAIL file(s)."
            exit 1
          fi
