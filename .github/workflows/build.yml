          SHA_LINUX_ARM64=$(sha256sum winload-linux-aarch64 | awk '{print $1}')
          SHA_MACOS_X64=$(sha256sum winload-macos-x86_64 | awk '{print $1}')
          SHA_MACOS_ARM64=$(sha256sum winload-macos-aarch64 | awk '{print $1}')

          cat > Formula/winload.rb << HEREDOC
          class Winload < Formula
