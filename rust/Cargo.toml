[package]
name = "winload"
version = "0.2.0-alpha.3"
edition = "2021"
build = "_build_info.rs"
description = "📊 Winload: A real-time terminal network traffic monitor inspired by nload. Dual implementations in 🦀Rust and 🐍Python, with cross-platform support for Windows, Linux, macOS and Android Termux. 🖥️ "
license = "MIT"
readme = "../readme.md"

[[bin]]
name = "winload"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.32"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
pcap = { version = "2", optional = true }

[features]
default = ["npcap"]
npcap = ["pcap"]

[profile.release]
opt-level = 3
lto = true
strip = true

[package.metadata.deb]
maintainer = "VincentZyu <vincentzyu233@gmail.com>"
copyright = "2025-2026, VincentZyu"
extended-description = """\
A lightweight, real-time CLI tool for monitoring \
network bandwidth and traffic. Cross-platform \
alternative to nload."""
depends = ""
section = "net"
priority = "optional"
assets = [
    ["target/release/winload", "usr/bin/winload", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/winload", dest = "/usr/bin/winload", mode = "755" },
]
